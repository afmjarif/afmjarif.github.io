{% comment %} params: images (list of {file, caption}), folder (e.g. /events/assets/) {% endcomment %}
{% if include.images and include.images.size > 0 %}
<h2>Gallery</h2>
<div class="gallery-grid">
  {% for img in include.images %}
    {% capture src %}{{ include.folder }}{{ img.file }}{% endcapture %}
    <figure>
      <a href="{{ src | relative_url }}" target="_blank" rel="noopener"><img src="{{ src | relative_url }}" alt="{{ img.caption | default: page.title | escape }}" loading="lazy"></a>
      {% if img.caption %}<figcaption>{{ img.caption }}</figcaption>{% endif %}
    </figure>
  {% endfor %}
</div>
{% endif %}
