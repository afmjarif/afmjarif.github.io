# ===== Basic Site Settings =====
locale                   : "en-US"
site_theme               : "default"
title                    : "A F M Atik Bokhtiar Jarif"
title_separator          : "-"
name                     : &name "A F M Atik Bokhtiar Jarif"
description              : &description "Computer Science student | Cybersecurity Enthusiast | Ethical Hacking & Robotics"
url                      : "https://afmjarif.github.io"
baseurl                  : ""
repository               : "afmjarif/afmjarif.github.io"

# ===== Author (sidebar) =====
author:
  avatar           : "profile.png"          # file in /images/
  name             : "A F M Atik Bokhtiar Jarif"
  bio              : "B.Sc. in CSE at Manarat International University. General Secretary of MIU CSE Club. Passionate about cybersecurity, ethical hacking, and robotics."
  location         : "Dhaka, Bangladesh"
  employer         : "Manarat International University"
  uri              : "https://www.manarat.ac.bd"
  email            : "afmjarif@gmail.com"
  phone            : "+8801575827658"

  googlescholar    : "https://scholar.google.com/citations?hl=en&user=7fC1AlUAAAAJ"

  github           : "afmjarif"
  facebook         : "afmjarif"
  instagram        : "afmjarif"
  linkedin         : "afmjarif"
  medium           : "https://medium.com/@afmjarif"
  twitter          : "afmjarif"
  youtube          : "afmjarif156"

# ===== Site Settings =====
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : false
read_more                : "disabled"
comments:
  provider               :
atom_feed:
  hide                   : false
  path                   :

# ===== SEO / Social =====
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : og-image.png
og_description           :
social:
  type                   :
  name                   :
  links:

analytics:
  provider               : false
  google:
    tracking_id          :

# ===== Reading Files =====
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - GUIDE.md
  - cleanup.sh
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# ===== Conversion =====
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# ===== Collections =====
collections:
  projects:
    output: true
    permalink: /:collection/:path/
  events:
    output: true
    permalink: /:collection/:path/

# ===== Defaults =====
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      author_profile: true
  - scope:
      path: ""
      type: events
    values:
      layout: event
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

# Blog posts live at /blog/<title>/
permalink: /blog/:title/
timezone: Asia/Dhaka

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
